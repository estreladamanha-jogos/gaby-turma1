<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de trabalho da Gaby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f6f4ff;
    }

    header {
      padding: 32px 16px;
      text-align: center;
      color: #fff;
      background: #6c4ce0;
    }

    header h1 {
      font-size: 1.8rem;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    section {
      margin-bottom: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    section h2 {
      margin-bottom: 8px;
      color: #6c4ce0;
      font-size: 1.3rem;
    }

    ul {
      padding-left: 20px;
    }

    footer {
      padding: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Área de trabalho da Gaby</h1>
    <p>Turma 1 · Estrela da Manhã Jogos</p>
  </header>

  <main>
    <section>
      <h2>Sobre mim</h2>
      <p>Escreva aqui quem você é e do que gosta.</p>
    </section>

    <section>
      <h2>Meus projetos</h2>
      <ul>
        <!-- Adicione um item para cada projeto novo -->
        <li>Primeiro projeto (em breve)</li>
      </ul>
    </section>

    <section>
      <h2>Anotações</h2>
      <p>Guarde aqui o que você aprendeu em cada aula.</p>
    </section>
  </main>

  <footer>
    <p>Feito pela Gaby</p>
  </footer>
</body>
</html>
