<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fagulha — Queda entre Mundos</title>
<style>
  html, body { margin: 0; height: 100%; background: #05050f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(96vw, calc(96vh * 420 / 640)); height: auto; background: #0a0a18; border-radius: 12px; box-shadow: 0 0 30px rgba(140,90,255,.35); }
</style>
</head>
<body>
<canvas id="game" width="420" height="640"></canvas>
<script>
/* Fagulha: um ET fofo e esquisito (cabeça grande, olhos enormes, orelhas de folha, braços e pernas compridos).
   o = { vx: -1..1 (inclinação), glow: cor da luz do peito (null = apagada), hit: true, alpha, pose: 'fall' | 'stand' | 'cheer' } */
function drawFagulha(c, x, y, s, t, o) {
  o = o || {};
  const glow = o.glow === undefined ? '#ffe9a8' : o.glow;
  const pose = o.pose || 'fall';
  const hit = !!o.hit;
  const sw = Math.sin(t * 7), sw2 = Math.sin(t * 7 + 1.9);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  const ear = Math.sin(t * 3.2) * 5;
  const skinL = hit ? '#f0c4c4' : '#d3cdf0', skinD = hit ? '#d99a9a' : '#9a91c4', line = '#2b2350';
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.rotate((o.vx || 0) * 0.16);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const P = { fall: [32, 78, 78, 12], stand: [-62, -78, -82, -6], cheer: [62, 88, 78, 8] }[pose];
  // ---- pernas (atrás do corpo) ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const hx = sd * 8, hy = 38;
    const kx = hx + sd * (5 + P[3] * .3) + ph * 3, ky = hy + 32;
    const fx = kx + sd * 3 + ph * (pose === 'fall' ? 9 : 2), fy = ky + 34;
    c.strokeStyle = line; c.lineWidth = 11; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = skinD; c.lineWidth = 7; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2;
    c.beginPath(); c.ellipse(fx + sd * 4, fy + 3, 12, 5.5, sd * -.12, 0, 7); c.fill(); c.stroke();
  }
  // ---- corpo ----
  const gb = c.createLinearGradient(0, -6, 0, 46); gb.addColorStop(0, skinL); gb.addColorStop(1, skinD);
  c.fillStyle = gb; c.strokeStyle = line; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(-9, -8); c.bezierCurveTo(-20, 4, -20, 34, -9, 44); c.lineTo(9, 44); c.bezierCurveTo(20, 34, 20, 4, 9, -8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, 26, 9, 13, 0, 0, 7); c.fill();
  // luz do peito (a "fagulha")
  if (glow) {
    const r = 9 + Math.sin(t * 5) * 1.6, g = c.createRadialGradient(0, 8, 0, 0, 8, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 8, r * 2.2, 0, 7); c.fill();
  }
  // ---- braços ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const a1 = (P[0] + ph * (pose === 'fall' ? 16 : 5)) * Math.PI / 180, a2 = (P[1] + ph * (pose === 'fall' ? 18 : 6)) * Math.PI / 180;
    const sx = sd * 14, sy = 4;
    const ex = sx + sd * 30 * Math.cos(a1), ey = sy - 30 * Math.sin(a1);
    const hx = ex + sd * 32 * Math.cos(a2), hy = ey - 32 * Math.sin(a2);
    c.strokeStyle = line; c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = skinL; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    // três dedos compridos
    const dir = Math.atan2(hy - ey, hx - ex);
    for (const k of [-.55, 0, .55]) {
      const fx = hx + Math.cos(dir + k) * 13, fy = hy + Math.sin(dir + k) * 13;
      c.strokeStyle = line; c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = skinL; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
    }
  }
  // ---- pescoço ----
  c.fillStyle = skinD; c.fillRect(-5, -14, 10, 10);
  // ---- orelhas ----
  for (const sd of [-1, 1]) {
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sd * 27, -64); c.bezierCurveTo(sd * 46, -70 - ear * .5, sd * 66, -88 - ear, sd * 76, -92 - ear);
    c.bezierCurveTo(sd * 70, -66, sd * 54, -40, sd * 30, -38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hit ? '#e8a0a0' : '#eeaacb';
    c.beginPath(); c.moveTo(sd * 32, -60); c.bezierCurveTo(sd * 48, -66 - ear * .4, sd * 60, -80 - ear * .8, sd * 68, -84 - ear * .8);
    c.bezierCurveTo(sd * 62, -64, sd * 50, -46, sd * 34, -44); c.closePath(); c.fill();
  }
  // ---- cabeça ----
  const gh = c.createLinearGradient(0, -80, 0, -4); gh.addColorStop(0, skinL); gh.addColorStop(1, skinD);
  c.fillStyle = gh; c.strokeStyle = line; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(0, -82); c.bezierCurveTo(34, -82, 42, -50, 24, -22); c.bezierCurveTo(16, -10, 7, -5, 0, -5);
  c.bezierCurveTo(-7, -5, -16, -10, -24, -22); c.bezierCurveTo(-42, -50, -34, -82, 0, -82); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-8, -70, 12, 6, -.4, 0, 7); c.fill();
  // ---- olhos enormes ----
  const look = (o.vx || 0) * 3;
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 15, -44); c.rotate(sd * .22);
    if (hit) {
      c.strokeStyle = line; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-8, -8); c.lineTo(8, 8); c.moveTo(8, -8); c.lineTo(-8, 8); c.stroke();
    } else {
      c.scale(1, blink);
      const ge = c.createRadialGradient(-2, -4, 1, 0, 0, 16); ge.addColorStop(0, '#3a3560'); ge.addColorStop(1, '#0a0716');
      c.fillStyle = ge; c.beginPath(); c.ellipse(0, 0, 11.5, 15, 0, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3.5 + look, -6, 3.6, 4.6, 0, 0, 7); c.fill();
      c.beginPath(); c.arc(3.5 + look * .6, 6, 1.9, 0, 7); c.fill();
    }
    c.restore();
  }
  // ---- nariz e boca ----
  c.fillStyle = line; c.beginPath(); c.arc(-2.4, -24, 1.1, 0, 7); c.arc(2.4, -24, 1.1, 0, 7); c.fill();
  c.strokeStyle = line; c.lineWidth = 2; c.beginPath();
  if (hit) c.ellipse(0, -15, 3, 4, 0, 0, 7); else { c.moveTo(-5, -17); c.quadraticCurveTo(0, -12.5, 5, -17); }
  c.stroke();
  c.restore();
}

/* ================= JOGO: FAGULHA — QUEDA ENTRE MUNDOS ================= */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };   // navegadores antigos
const W = 420, H = 640;
const PY = 190;                 // altura fixa do Fagulha na tela (o cenário é que sobe)
const BASE_V = 230;             // velocidade da queda (pixels por segundo)
const META = 1000;              // meta final em metros
const METROS_POR_MUNDO = 250;   // cada mundo dura 250 metros
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- os 4 mundos ---------- */
const MUNDOS = [
  { nome: 'Floresta Encantada', cor1: '#0f2f18', cor2: '#123c1d', accent: '#7CFF9E', trilha: '#1d4a26', particula: 'folha',   obst: 'galho', velMul: 1,    spawn: 1.35 },
  { nome: 'Geleira Frienta',    cor1: '#0a1f33', cor2: '#123049', accent: '#8fe0ff', trilha: '#1c3e57', particula: 'gelo',    obst: 'cubo',  velMul: 1.15, spawn: 1.0  },
  { nome: 'Vulcão Calorento',   cor1: '#3a0d0d', cor2: '#4a1010', accent: '#ff7a45', trilha: '#5c1a1a', particula: 'brasa',   obst: 'fogo',  velMul: 1.3,  spawn: .9   },
  { nome: 'Espaço Gelado',      cor1: '#160a2e', cor2: '#1f0f3d', accent: '#c299ff', trilha: '#2a1850', particula: 'estrela', obst: 'laser', velMul: 1.65, spawn: .85  },
];

let estado = 'inicio';          // inicio | jogando | gameover | vitoria
let t = 0, dist = 0, vel = BASE_V;
let vidas = 3, invenc = 0, cristais = 0, shake = 0;
const jog = { x: W / 2, vx: 0, dir: 1 };
let obst = [], gems = [], fx = [], amb = [];
let spawnT = 1, gemT = 1, ambT = .4;

// ---- controle dos mundos ----
let mundoIdx = 0;               // mundo atual (0 a 3)
let anel = null;                 // anel de transição vindo pela frente: { y, idx } (null = nenhum)
let bannerT = 0;                 // tempo restante mostrando o nome do mundo
let flashT = 0;                  // flash branco ao trocar de mundo
let laserLado = -1;              // alterna o lado do laser no espaço

// ---- poderes ----
const DASH_DUR = .22, DASH_CD = 3, DASH_VEL = 560;
const RAIO_CD = 4;
let dashT = 0, dashCD = 0;       // dash: duração ativa / recarga
let raioCD = 0;                  // raio: recarga
let raioFxT = 0;                 // efeito visual do raio (segundos restantes)
let avisoT = 0;                  // aviso "não funciona aqui"

function mundoAtual() { return MUNDOS[clamp(mundoIdx, 0, MUNDOS.length - 1)]; }

function trocarMundo(novoIdx) {
  mundoIdx = novoIdx;
  bannerT = 2.4;                  // tempo do nome na tela
  flashT = .5;                    // flash branco de meio segundo
  burst(jog.x, PY, mundoAtual().accent, 26, 200);
}

function resetar() {
  estado = 'jogando'; t = 0; dist = 0; vidas = 3; invenc = 0; cristais = 0; shake = 0;
  jog.x = W / 2; jog.vx = 0; obst = []; gems = []; fx = []; amb = []; spawnT = 1; gemT = 1; ambT = .4;
  mundoIdx = 0; anel = null; bannerT = 0; flashT = 0; laserLado = -1;
  dashT = 0; dashCD = 0; raioCD = 0; raioFxT = 0; avisoT = 0;
}

/* ---------- poderes ---------- */
function ativarDash() {
  if (dashCD > 0) return;
  dashT = DASH_DUR; dashCD = DASH_CD;
  burst(jog.x, PY, '#fff', 14, 160);
}

function ativarRaio() {
  if (raioCD > 0) return;
  raioCD = RAIO_CD; raioFxT = .35;
  const tipo = mundoAtual().obst;
  if (tipo === 'galho') {
    for (const o of obst) if (o.tp === 'galho' && !o.morto) { o.morto = true; burst(W / 2, o.y, '#ffcf7a', 14, 140); }
  } else if (tipo === 'cubo') {
    for (const o of obst) if (o.tp === 'cubo' && !o.morto) { o.morto = true; burst(o.x, o.y, '#bfe9ff', 14, 140); }
  } else {
    avisoT = 1.4;
  }
}

/* ---------- obstáculos: um tipo diferente para cada mundo ---------- */
function criarObstaculo() {
  const tipo = mundoAtual().obst;
  if (tipo === 'galho') {
    const gapSide = Math.random() < .5 ? 'esq' : 'dir';
    obst.push({ tp: 'galho', y: H + 50, gapSide, gapW: rnd(120, 150), esp: 22 });
  } else if (tipo === 'cubo') {
    obst.push({ tp: 'cubo', x: rnd(50, W - 50), y: H + 40, s: rnd(28, 42), rot: rnd(0, 6.28) });
  } else if (tipo === 'fogo') {
    obst.push({ tp: 'fogo', baseX: rnd(80, W - 80), y: H + 40, r: rnd(16, 22), fase: rnd(0, 6.28), oscVel: rnd(2, 3.2), amp: rnd(60, 100), px: 0 });
  } else if (tipo === 'laser') {
    laserLado = laserLado === 'esq' ? 'dir' : 'esq';
    obst.push({ tp: 'laser', y: H + 40, lado: laserLado, gapW: rnd(120, 150), esp: 16 });
  }
}

function desenharObstaculo(o) {
  if (o.tp === 'galho') {
    const gapStart = o.gapSide === 'esq' ? 0 : W - o.gapW;
    const gapEnd = gapStart + o.gapW;
    const h = o.esp;
    c.save(); c.translate(0, o.y);
    for (const [x0, x1] of [[0, gapStart], [gapEnd, W]]) {
      if (x1 - x0 < 2) continue;
      c.fillStyle = '#6b4423'; c.strokeStyle = '#3a260f'; c.lineWidth = 2.4;
      c.fillRect(x0, -h / 2, x1 - x0, h); c.strokeRect(x0, -h / 2, x1 - x0, h);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x0, -h / 2, x1 - x0, h / 2.6);
      // arara pousada na ponta do galho perto da abertura
      const px = o.gapSide === 'esq' ? x1 - 20 : x0 + 20;
      c.save(); c.translate(px, -h / 2);
      c.fillStyle = '#ff5533'; c.beginPath(); c.ellipse(0, -7, 8, 6.5, 0, 0, 7); c.fill();
      c.fillStyle = '#2a6bff'; c.beginPath(); c.ellipse(0, -13, 5, 5, 0, 0, 7); c.fill();
      c.fillStyle = '#ffd23d'; c.beginPath(); c.moveTo(6, -13); c.lineTo(13, -11); c.lineTo(6, -9); c.closePath(); c.fill();
      c.restore();
    }
    c.restore();
  } else if (o.tp === 'cubo') {
    c.save(); c.translate(o.x, o.y); c.rotate(o.rot);
    const s = o.s;
    c.fillStyle = '#bfe9ff'; c.strokeStyle = '#7fc9f0'; c.lineWidth = 2.4;
    c.beginPath(); c.rect(-s / 2, -s / 2, s, s); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.moveTo(-s / 2, -s / 2); c.lineTo(0, -s / 2); c.lineTo(-s / 2, 0); c.closePath(); c.fill();
    c.restore();
  } else if (o.tp === 'fogo') {
    c.save(); c.translate(o.px, o.y);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, o.r * 1.8);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(.5, '#ff6a2e'); g.addColorStop(1, 'rgba(255,40,10,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, o.r * 1.8, 0, 7); c.fill();
    c.fillStyle = '#ffcf7a'; c.beginPath(); c.arc(0, 0, o.r, 0, 7); c.fill();
    c.restore();
  } else if (o.tp === 'laser') {
    const gapStart = o.lado === 'esq' ? 0 : W - o.gapW;
    const gapEnd = gapStart + o.gapW;
    const h = o.esp;
    c.save(); c.translate(0, o.y);
    for (const [x0, x1] of [[0, gapStart], [gapEnd, W]]) {
      if (x1 - x0 < 2) continue;
      const g = c.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, 'rgba(200,140,255,0)'); g.addColorStop(.5, '#e2a8ff'); g.addColorStop(1, 'rgba(200,140,255,0)');
      c.fillStyle = g; c.fillRect(x0, -h / 2, x1 - x0, h);
      c.fillStyle = '#fff'; c.fillRect(x0, -h / 6, x1 - x0, h / 3);
    }
    c.restore();
  }
}

/* ---------- partículas de impacto/coleta ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}

/* ---------- partículas ambientes de cada mundo ---------- */
function criarAmbiente() {
  const p = mundoAtual().particula;
  if (p === 'folha') {
    amb.push({ tp: p, x: rnd(0, W), y: -20, vx: rnd(-20, 20), vy: rnd(40, 80), rot: rnd(0, 6.28), vr: rnd(-2, 2), s: rnd(6, 11) });
  } else if (p === 'gelo') {
    amb.push({ tp: p, x: rnd(0, W), y: -20, vx: rnd(-10, 10), vy: rnd(60, 110), rot: rnd(0, 6.28), vr: rnd(-1, 1), s: rnd(4, 9) });
  } else if (p === 'brasa') {
    amb.push({ tp: p, x: rnd(0, W), y: H + 20, vx: rnd(-15, 15), vy: rnd(-70, -110), rot: 0, vr: 0, s: rnd(2, 5) });
  } else if (p === 'estrela') {
    amb.push({ tp: p, x: rnd(0, W), y: rnd(0, H), vx: 0, vy: rnd(20, 55), rot: 0, vr: 0, s: rnd(1, 2.6), pisca: rnd(0, 6.28) });
  }
}

function atualizarAmbiente(dt) {
  ambT -= dt;
  if (ambT <= 0) { criarAmbiente(); ambT = .18; }
  for (const p of amb) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.tp === 'folha') p.x += Math.sin(t * 2 + p.y * .05) * 12 * dt;
    if (p.tp === 'estrela') p.pisca += dt * 4;
  }
  amb = amb.filter(p => p.y > -30 && p.y < H + 30);
}

function desenharAmbiente() {
  for (const p of amb) {
    c.save(); c.translate(p.x, p.y); c.rotate(p.rot || 0);
    if (p.tp === 'folha') {
      c.fillStyle = mundoAtual().accent; c.strokeStyle = '#0d2410'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, -p.s); c.quadraticCurveTo(p.s, 0, 0, p.s); c.quadraticCurveTo(-p.s, 0, 0, -p.s); c.closePath(); c.fill(); c.stroke();
    } else if (p.tp === 'gelo') {
      c.fillStyle = 'rgba(200,235,255,.85)'; c.strokeStyle = '#bfe9ff'; c.lineWidth = 1;
      c.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * 6.283, r = p.s * (k % 2 ? .6 : 1); const px = Math.cos(a) * r, py = Math.sin(a) * r; k ? c.lineTo(px, py) : c.moveTo(px, py); } c.closePath(); c.fill(); c.stroke();
    } else if (p.tp === 'brasa') {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, p.s * 3);
      g.addColorStop(0, '#fff3b0'); g.addColorStop(.4, '#ff9a3d'); g.addColorStop(1, 'rgba(255,60,20,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, p.s * 3, 0, 7); c.fill();
      c.fillStyle = '#ffcf7a'; c.beginPath(); c.arc(0, 0, p.s, 0, 7); c.fill();
    } else if (p.tp === 'estrela') {
      c.globalAlpha = .5 + Math.sin(p.pisca) * .5;
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, p.s, 0, 7); c.fill();
      c.globalAlpha = 1;
    }
    c.restore();
  }
}

/* ---------- entrada ---------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab', 'KeyF'].includes(k)) e.preventDefault();
  if (estado !== 'jogando') { if (k === 'Space' || k === 'Enter' || k === 'KeyR') resetar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (k === 'Space' && !e.repeat) ativarDash();
  if (k === 'KeyF' && !e.repeat) ativarRaio();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
const keys = { left: false, right: false };

/* ---------- atualização ---------- */
function update(dt) {
  if (estado !== 'jogando') return;
  t += dt;
  vel = BASE_V * mundoAtual().velMul;   // cada mundo tem sua própria velocidade (espaço é bem mais rápido)
  dist += vel * dt;
  if (invenc > 0) invenc -= dt;
  if (shake > 0) shake -= dt;
  if (bannerT > 0) bannerT -= dt;
  if (flashT > 0) flashT -= dt;
  if (dashCD > 0) dashCD -= dt;
  if (raioCD > 0) raioCD -= dt;
  if (raioFxT > 0) raioFxT -= dt;
  if (avisoT > 0) avisoT -= dt;

  // ---- movimento do Fagulha ----
  const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (ax) jog.dir = ax;
  if (dashT > 0) {
    dashT -= dt;
    jog.x = clamp(jog.x + jog.dir * DASH_VEL * dt, 34, W - 34);
    jog.vx = 0;
  } else {
    jog.vx += (ax * 300 - jog.vx) * Math.min(1, dt * 10);
    jog.x = clamp(jog.x + jog.vx * dt, 34, W - 34);
  }

  // ---- mundos: o anel nasce a cada 250 metros e desce junto com o cenário ----
  const metros = dist / 10;
  const idxAlvo = clamp(Math.floor(metros / METROS_POR_MUNDO), 0, MUNDOS.length - 1);
  if (idxAlvo !== mundoIdx && (!anel || anel.idx !== idxAlvo)) {
    anel = { y: H + 60, idx: idxAlvo };
  }
  if (anel) {
    anel.y -= vel * dt;                          // o anel se move como o resto do cenário
    if (anel.y <= PY + 10 && mundoIdx !== anel.idx) {
      trocarMundo(anel.idx);                      // só troca quando o Fagulha atravessa o anel
    }
    if (anel.y < -60) anel = null;
  }

  // ---- partículas ambiente do mundo ----
  atualizarAmbiente(dt);

  // ---- obstáculos ----
  spawnT -= dt;
  if (spawnT <= 0) {
    criarObstaculo();
    spawnT = mundoAtual().spawn;
  }
  for (const o of obst) {
    o.y -= vel * dt;
    if (o.tp === 'fogo') { o.px = o.baseX + Math.sin(t * o.oscVel + o.fase) * o.amp; }
  }
  obst = obst.filter(o => o.y > -80 && !o.morto);

  // ---- cristais ----
  gemT -= dt;
  if (gemT <= 0) { gems.push({ x: rnd(40, W - 40), y: H + 30 }); gemT = .75; }
  for (const g of gems) g.y -= vel * dt;
  gems = gems.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) { cristais++; burst(g.x, g.y, '#7af6ff', 8, 90); return false; }
    return g.y > -30;
  });

  // ---- colisões ----
  const hb = { x: jog.x - 15, y: PY - 26, w: 30, h: 58 };
  for (const o of obst) {
    if (o.morto) continue;
    let bateu = false;
    if (o.tp === 'galho' || o.tp === 'laser') {
      const gapStart = o.gapSide ? (o.gapSide === 'esq' ? 0 : W - o.gapW) : (o.lado === 'esq' ? 0 : W - o.gapW);
      const gapEnd = gapStart + o.gapW;
      const metade = o.esp / 2;
      const dentroDaFaixa = hb.y < o.y + metade && hb.y + hb.h > o.y - metade;
      const naAbertura = hb.x >= gapStart && hb.x + hb.w <= gapEnd;
      bateu = dentroDaFaixa && !naAbertura;
    } else if (o.tp === 'cubo') {
      const ox = o.x - o.s * .42, oy = o.y - o.s * .42, ow = o.s * .84, oh = o.s * .84;
      bateu = hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy;
    } else if (o.tp === 'fogo') {
      const dx = (jog.x) - o.px, dy = (PY + 3) - o.y;
      bateu = Math.hypot(dx, dy) < o.r + 15;
    }
    if (bateu) {
      if (invenc > 0 || dashT > 0) continue;
      levarDano(o);
      break;
    }
  }

  // ---- partículas de impacto ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);

  // ---- fim de jogo ----
  if (metros >= META) { estado = 'vitoria'; }
}

function levarDano(o) {
  vidas--; invenc = 1.5; shake = .3; burst(jog.x, PY, '#ff5577', 16, 180);
  if (o) o.morto = true;
  if (vidas <= 0) estado = 'gameover';
}

/* ---------- desenho ---------- */
function fundo() {
  const m = mundoAtual();
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, m.cor1); g.addColorStop(1, m.cor2); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = m.trilha; for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.fillRect(0, y, 26, 100); c.fillRect(W - 26, y, 26, 100); }
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 2; for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.strokeRect(2, y + 2, 22, 96); c.strokeRect(W - 24, y + 2, 22, 96); }
}

function anelTransicao() {
  if (anel === null) return;
  const m = MUNDOS[anel.idx];
  c.save(); c.globalAlpha = clamp(1 - Math.abs(anel.y - H / 2) / (H / 2), 0, 1) * .9 + .1;
  c.strokeStyle = m.accent; c.lineWidth = 6; c.beginPath(); c.ellipse(W / 2, anel.y, W * .62, 16, 0, 0, 7); c.stroke();
  c.lineWidth = 2; c.globalAlpha *= .6; c.beginPath(); c.ellipse(W / 2, anel.y, W * .62 + 10, 20, 0, 0, 7); c.stroke();
  c.restore();
}

function desenhar() {
  c.save();
  if (shake > 0) c.translate(rnd(-5, 5), rnd(-5, 5));
  fundo();
  desenharAmbiente();
  anelTransicao();

  for (const g of gems) {
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 3 + g.x) * .3);
    c.fillStyle = '#7af6ff'; c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 0); c.lineTo(0, 11); c.lineTo(-8, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -8); c.lineTo(3, -1); c.lineTo(-3, -1); c.fill(); c.restore();
  }
  for (const o of obst) desenharObstaculo(o);

  // ---- raio (poder da tecla F): atira pra baixo, na direção dos obstáculos ----
  if (raioFxT > 0) {
    c.save(); c.globalAlpha = clamp(raioFxT / .35, 0, 1);
    c.strokeStyle = '#fff59d'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(jog.x + rnd(-6, 6), PY + 20);
    for (let y = PY + 60; y < H; y += 40) c.lineTo(jog.x + rnd(-16, 16), y);
    c.stroke();
    c.restore();
  }

  // ---- o Fagulha ----
  const piscando = invenc > 0 && Math.floor(t * 14) % 2 === 0;
  if (estado !== 'gameover') {
    if (dashT > 0) { c.save(); c.globalAlpha = .35; c.fillStyle = '#fff'; c.beginPath(); c.arc(jog.x, PY + 12, 34, 0, 7); c.fill(); c.restore(); }
    drawFagulha(c, jog.x, PY + 12, .42, t, {
      vx: clamp(jog.vx / 300, -1, 1), hit: invenc > 1.2 && dashT <= 0,
      alpha: piscando ? .3 : 1 });
  }
  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.restore();
  if (flashT > 0) { c.fillStyle = `rgba(255,255,255,${clamp(flashT / .5, 0, 1)})`; c.fillRect(0, 0, W, H); }
  hud();
  barrasPoderes();
  avisoRaio();
  bannerMundo();
  telas();
}

/* ---------- HUD e telas ---------- */
function texto(txt, x, y, tam, cor, al) {
  c.font = `${tam}px 'Press Start 2P', monospace`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 4); c.strokeStyle = '#0a0a18'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function hud() {
  if (estado === 'inicio') return;
  c.font = '20px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) c.fillText(i < vidas ? '❤️' : '🖤', 12 + i * 26, 22);
  texto('💎 ' + cristais, W - 14, 22, 12, '#7af6ff', 'right');
  const pr = clamp((dist / 10) / META, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 14, 44, 6, 140);
  c.fillStyle = mundoAtual().accent; c.fillRect(W - 14, 44, 6, 140 * pr);
  texto(Math.floor(dist / 10) + ' m', W - 11, 196, 8, '#fff', 'right');
}

function barrasPoderes() {
  if (estado !== 'jogando') return;
  const desenhaBarra = (x, label, cd, cdMax, cor) => {
    const w = 92, hgt = 14, y = H - 26;
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(x, y, w, hgt);
    const pr = 1 - clamp(cd / cdMax, 0, 1);
    c.fillStyle = pr >= 1 ? cor : '#555';
    c.fillRect(x, y, w * pr, hgt);
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; c.strokeRect(x, y, w, hgt);
    texto(label, x + w / 2, y - 10, 7, '#fff');
  };
  desenhaBarra(20, 'DASH (ESPAÇO)', dashCD, DASH_CD, '#8fe0ff');
  desenhaBarra(W - 112, 'RAIO (F)', raioCD, RAIO_CD, '#fff59d');
}

function avisoRaio() {
  if (avisoT <= 0) return;
  c.save(); c.globalAlpha = clamp(avisoT / .3, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(0, PY - 30, W, 40);
  texto('O RAIO NÃO FUNCIONA AQUI!', W / 2, PY - 10, 9, '#ff8888');
  c.restore();
}

function bannerMundo() {
  if (estado !== 'jogando' || bannerT <= 0) return;
  const m = mundoAtual();
  const al = clamp(Math.min(bannerT, 2.4 - bannerT * 0 + 1) , 0, 1) * clamp(bannerT / .5, 0, 1) * clamp((2.4 - bannerT) > 0 ? 1 : 0, 0, 1);
  const alpha = bannerT > 1.9 ? (2.4 - bannerT) / .5 : clamp(bannerT / .5, 0, 1);
  c.save(); c.globalAlpha = clamp(alpha, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 130, W, 60);
  texto(m.nome, W / 2, 160, 16, m.accent);
  c.restore();
}

function telas() {
  if (estado === 'inicio') {
    c.fillStyle = 'rgba(5,5,20,.72)'; c.fillRect(0, 0, W, H);
    texto('FAGULHA', W / 2, 150, 34, '#ffe9a8');
    texto('QUEDA ENTRE MUNDOS', W / 2, 200, 12, '#7af6ff');
    drawFagulha(c, W / 2, 345, .9, performance.now() / 1000, { pose: 'stand' });
    if (Math.floor(performance.now() / 500) % 2) texto('APERTE ESPAÇO', W / 2, 520, 14, '#fff');
  } else if (estado === 'gameover') {
    c.fillStyle = 'rgba(30,0,10,.78)'; c.fillRect(0, 0, W, H);
    texto('GAME OVER', W / 2, 220, 30, '#ff3355');
    texto('💎 ' + cristais + '   ⬇ ' + Math.floor(dist / 10) + ' m', W / 2, 290, 12, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 400, 11, '#fff');
  } else if (estado === 'vitoria') {
    c.fillStyle = 'rgba(0,20,10,.78)'; c.fillRect(0, 0, W, H);
    texto('CHEGOU AO FUNDO!', W / 2, 170, 20, '#7CFF9E');
    drawFagulha(c, W / 2, 300, .95, performance.now() / 1000, { pose: 'cheer', glow: '#7CFF9E' });
    texto('💎 ' + cristais, W / 2, 470, 16, '#7af6ff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 540, 11, '#fff');
  }
}

/* ---------- laço principal ---------- */
let ultimo = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try {
  if (estado === 'inicio') t += dt;
  update(dt);
  desenhar();
  } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
